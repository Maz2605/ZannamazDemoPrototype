<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="50%" stop-color="#fecfef" />
      <stop offset="100%" stop-color="#a1c4fd" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#a14e6d" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Cheerful Candy Sky Background -->
  <rect width="640" height="400" fill="url(#sky)" />

  <!-- Background decorative candy sparkles -->
  <circle cx="80" cy="70" r="10" fill="#ffd166" opacity="0.6" />
  <circle cx="120" cy="110" r="5" fill="#ffffff" opacity="0.8" />
  <circle cx="560" cy="80" r="8" fill="#ff758c" opacity="0.6" />
  <circle cx="530" cy="120" r="12" fill="#ffd166" opacity="0.7" />
  <circle cx="90" cy="330" r="8" fill="#4cc9f0" opacity="0.6" />
  <circle cx="550" cy="310" r="10" fill="#06d6a0" opacity="0.7" />

  <!-- Dessert Board Plate -->
  <rect x="130" y="35" width="380" height="330" rx="34" fill="#fffdf5" stroke="#ffffff" stroke-width="6" filter="url(#softShadow)" />

  <!-- Cake Slice Left (Strawberry Pink Glaze) -->
  <path d="M 180 85 Q 315 85 315 85 L 265 270 Q 180 270 180 230 Z" fill="#fff0f5" stroke="#ff758c" stroke-width="5" />
  <path d="M 180 85 Q 315 85 315 85 L 265 270 Q 180 270 180 230 Z" fill="#ff4d6d" opacity="0.2" />

  <!-- Cute smiling candies on Left -->
  <!-- Candy 1 Pink -->
  <circle cx="235" cy="140" r="16" fill="#ff4d6d" stroke="#fff" stroke-width="2.5" />
  <ellipse cx="230" cy="135" rx="5" ry="3" fill="#fff" opacity="0.85" />
  <circle cx="231" cy="141" r="1.5" fill="#3a2010" />
  <circle cx="239" cy="141" r="1.5" fill="#3a2010" />

  <!-- Candy 2 Yellow -->
  <circle cx="220" cy="205" r="16" fill="#ffd60a" stroke="#fff" stroke-width="2.5" />
  <ellipse cx="215" cy="200" rx="5" ry="3" fill="#fff" opacity="0.85" />
  <circle cx="216" cy="206" r="1.5" fill="#3a2010" />
  <circle cx="224" cy="206" r="1.5" fill="#3a2010" />

  <!-- Cake Slice Right (Blueberry Glaze) -->
  <path d="M 330 85 Q 460 85 460 125 L 460 235 Q 460 270 280 270 Z" fill="#f0f9ff" stroke="#4cc9f0" stroke-width="5" />
  <path d="M 330 85 Q 460 85 460 125 L 460 235 Q 460 270 280 270 Z" fill="#4cc9f0" opacity="0.2" />

  <!-- Cute smiling candies on Right -->
  <!-- Candy 3 Blue -->
  <circle cx="395" cy="145" r="16" fill="#4cc9f0" stroke="#fff" stroke-width="2.5" />
  <ellipse cx="390" cy="140" rx="5" ry="3" fill="#fff" opacity="0.85" />
  <circle cx="391" cy="146" r="1.5" fill="#3a2010" />
  <circle cx="399" cy="146" r="1.5" fill="#3a2010" />

  <!-- Candy 4 Green -->
  <circle cx="385" cy="215" r="16" fill="#4cd964" stroke="#fff" stroke-width="2.5" />
  <ellipse cx="380" cy="210" rx="5" ry="3" fill="#fff" opacity="0.85" />
  <circle cx="381" cy="216" r="1.5" fill="#3a2010" />
  <circle cx="389" cy="216" r="1.5" fill="#3a2010" />

  <!-- Slicing Line with Scissors -->
  <line x1="335" y1="50" x2="260" y2="305" stroke="#8338ec" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round" />

  <circle cx="300" cy="170" r="28" fill="#ffffff" stroke="#ffd1df" stroke-width="3" filter="url(#softShadow)" />
  <text x="300" y="180" text-anchor="middle" font-size="30">✂️</text>

  <!-- Title Pill Badge -->
  <rect x="205" y="300" width="230" height="46" rx="23" fill="#ff5d8f" stroke="#ffffff" stroke-width="3" filter="url(#softShadow)" />
  <text x="320" y="330" text-anchor="middle" font-family="'Fredoka', 'Quicksand', 'Trebuchet MS', system-ui, sans-serif" font-weight="700" font-size="21" fill="#ffffff" letter-spacing="1">🍰 SLICE CUT ✨</text>
</svg>
